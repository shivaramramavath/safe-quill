services:
  mongodb:
    image: mongo:7
    container_name: safequill-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-safequill_secret}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: safequill-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: safequill-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-root}:${MONGO_INITDB_ROOT_PASSWORD:-safequill_secret}@mongodb:27017/safequill?authSource=admin
      FRONTEND_URL: http://localhost:3000
      ML_SERVICE_URL: http://ml:8000
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_started

  ml:
    build:
      context: apps/ml
      dockerfile: Dockerfile
    container_name: safequill-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: safequill-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api

volumes:
  mongodb_data:
  redis_data:
