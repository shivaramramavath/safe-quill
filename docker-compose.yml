services:
  redis:
    image: redis:7-alpine
    container_name: safequill-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: safequill-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGODB_URI: ${MONGODB_URI}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ML_SERVICE_URL: http://ml:8000
      GROQ_API_KEY: ${GROQ_API_KEY}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-noreply@safequill.local}
      JWT_SECRET: ${JWT_SECRET:-safequill_super_secret_jwt_key_prod}
    depends_on:
      redis:
        condition: service_healthy

  ml:
    build:
      context: .
      dockerfile: apps/ml/Dockerfile
    container_name: safequill-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: safequill-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      - api

volumes:
  redis_data:
